{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Offline | RoadGuard</title>
  <link rel="icon" type="image/png" href="{% static 'icons/icon-192.png' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="rg-offline-page">
  <main class="rg-offline-card">
    <img src="{% static 'icons/icon-192.png' %}" width="96" height="96" alt="RoadGuard app icon">
    <p class="eyebrow text-primary mt-4 mb-2">ROADGUARD</p>
    <h1 class="h3 fw-bold">You're offline</h1>
    <p class="text-secondary">RoadGuard needs an internet connection to show live requests, provider availability and maps. Your account and request information are not stored for offline viewing.</p>
    <button type="button" class="btn btn-primary" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
